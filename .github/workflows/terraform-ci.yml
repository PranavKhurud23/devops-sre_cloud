name: Terraform LocalStack Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  terraform-localstack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start LocalStack Docker Container
        run: |
          docker run -d \
            --name localstack_main \
            -p 127.0.0.1:4566:4566 \
            -e DEBUG=1 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            localstack/localstack:3.4.0

      - name: Install awslocal CLI
        run: pip install awscli-local

      - name: Wait for LocalStack Readiness
        run: |
          echo "Waiting for LocalStack services to be ready..."
          until curl -s http://127.0.0.1:4566/_localstack/health | grep -q '"s3": "running"\|"s3": "available"'; do
            echo "LocalStack is starting, waiting 3 seconds..."
            sleep 3
          done
          echo "LocalStack is fully active!"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Verify Created Resources
        run: |
          echo "=== Listing S3 Buckets ==="
          awslocal --endpoint-url=http://127.0.0.1:4566 s3 ls
          echo "=== Listing SQS Queues ==="
          awslocal --endpoint-url=http://127.0.0.1:4566 sqs list-queues
